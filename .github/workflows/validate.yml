name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    # continue-on-error: the two checks this currently fails on (repository
    # topics, brands assets) gate eligibility for the *official* HACS
    # default store, not whether the repo installs as a HACS custom
    # repository (which is how this integration is meant to be used today -
    # see README). Topics are set; brands requires a separate PR to
    # home-assistant/brands. Kept non-blocking until/unless that's done.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  translations-in-sync:
    name: strings.json matches translations/en.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diff strings.json against translations/en.json
        run: |
          diff custom_components/healthbox/strings.json \
               custom_components/healthbox/translations/en.json

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-test.txt
      - run: pytest tests/ -v
